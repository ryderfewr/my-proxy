<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FreeProxy</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #080810;
      --card: #10101e;
      --border: #1e1e35;
      --accent: #7c6aff;
      --accent2: #ff6a9e;
      --text: #f0f0ff;
      --muted: #5a5a7a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }
    .blob {
      position: fixed; border-radius: 50%;
      filter: blur(80px); opacity: 0.13;
      animation: drift 10s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .blob1 { width: 400px; height: 400px; background: var(--accent); top: -100px; left: -100px; }
    .blob2 { width: 300px; height: 300px; background: var(--accent2); bottom: -80px; right: -80px; animation-delay: 3s; }
    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to { transform: translate(30px,20px) scale(1.1); }
    }

    .container {
      position: relative; z-index: 1;
      width: 100%; max-width: 620px;
      display: flex; flex-direction: column;
      align-items: center; gap: 24px;
    }

    .logo-icon { font-size: 48px; animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse {
      0%,100% { filter: drop-shadow(0 0 20px var(--accent)); }
      50% { filter: drop-shadow(0 0 35px var(--accent2)); }
    }
    h1 {
      font-family: 'Syne', sans-serif; font-size: 2.2rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle { color: var(--muted); font-size: 14px; margin-top: -16px; }

    /* Status badge */
    #status {
      font-size: 12px; padding: 6px 14px; border-radius: 20px;
      border: 1px solid var(--border); color: var(--muted);
      display: flex; align-items: center; gap: 6px;
    }
    #status.ready { border-color: #4caf50; color: #4caf50; }
    #status.loading { border-color: var(--accent); color: var(--accent); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .dot.spin { animation: blink 1s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* Search bar */
    .search-wrap { width: 100%; display: flex; gap: 10px; }
    input {
      flex: 1; padding: 15px 18px; border-radius: 14px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--text); font-size: 15px; font-family: 'DM Sans', sans-serif;
      outline: none; transition: border 0.2s, box-shadow 0.2s;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,106,255,0.15); }
    input::placeholder { color: var(--muted); }
    .go-btn {
      padding: 15px 26px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; border-radius: 14px; color: white;
      font-size: 15px; font-weight: 700; font-family: 'Syne', sans-serif;
      cursor: pointer; transition: opacity 0.2s, transform 0.1s;
    }
    .go-btn:hover { opacity: 0.9; transform: scale(1.02); }
    .go-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Featured */
    .featured {
      width: 100%;
      background: linear-gradient(135deg, #1a1040, #2a1060);
      border: 1px solid var(--accent); border-radius: 16px;
      padding: 18px 20px; display: flex; align-items: center; gap: 14px;
      cursor: pointer; transition: transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 0 24px rgba(124,106,255,0.2);
    }
    .featured:hover { transform: translateY(-2px); box-shadow: 0 8px 40px rgba(124,106,255,0.35); }
    .fi { font-size: 36px; flex-shrink: 0; }
    .fl { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 3px; }
    .fn { font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 800; }
    .fd { font-size: 12px; color: #a090cc; }
    .fa { font-size: 22px; color: var(--accent); margin-left: auto; animation: bounce 2s ease-in-out infinite; }
    @keyframes bounce { 0%,100%{transform:translateX(0)} 50%{transform:translateX(4px)} }

    /* Grid */
    .section-label {
      align-self: flex-start; font-size: 10px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
    }
    .grid { width: 100%; display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px 10px; cursor: pointer;
      text-align: center; display: flex; flex-direction: column;
      align-items: center; gap: 6px;
      transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(124,106,255,0.15); }
    .ci { font-size: 22px; }
    .cn { font-size: 13px; font-weight: 500; }
    .cd { font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <div class="container">
    <div class="logo-icon">🌐</div>
    <h1>FreeProxy</h1>
    <p class="subtitle">Powered by Ultraviolet — sites load properly</p>

    <div id="status">
      <div class="dot spin"></div>
      <span id="status-text">Setting up proxy engine...</span>
    </div>

    <div class="search-wrap">
      <input id="url" type="text" placeholder='Type "cloudmoon", "youtube", or any site...' autofocus/>
      <button class="go-btn" id="go-btn" onclick="go()" disabled>Go →</button>
    </div>

    <div class="featured" onclick="go('https://web.cloudmoonapp.com')">
      <div class="fi">🎮</div>
      <div>
        <div class="fl">⭐ Play Games Free</div>
        <div class="fn">CloudMoon</div>
        <div class="fd">Stream & play games in your browser</div>
      </div>
      <div class="fa">→</div>
    </div>

    <p class="section-label">Quick Access</p>
    <div class="grid">
      <div class="card" onclick="go('https://www.google.com')">
        <div class="ci">🔍</div><div class="cn">Google</div><div class="cd">Search</div>
      </div>
      <div class="card" onclick="go('https://www.youtube.com')">
        <div class="ci">▶️</div><div class="cn">YouTube</div><div class="cd">Videos</div>
      </div>
      <div class="card" onclick="go('https://poki.com')">
        <div class="ci">🕹️</div><div class="cn">Poki</div><div class="cd">Browser games</div>
      </div>
      <div class="card" onclick="go('https://itch.io')">
        <div class="ci">🎯</div><div class="cn">itch.io</div><div class="cd">Indie games</div>
      </div>
      <div class="card" onclick="go('https://www.reddit.com')">
        <div class="ci">💬</div><div class="cn">Reddit</div><div class="cd">Communities</div>
      </div>
      <div class="card" onclick="go('https://www.wikipedia.org')">
        <div class="ci">📖</div><div class="cn">Wikipedia</div><div class="cd">Knowledge</div>
      </div>
    </div>
  </div>

  <!-- Load UV bundle and bare-mux client -->
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
  <script src="/bare-mux/index.js"></script>
  <script>
    const known = {
      cloudmoon: 'https://web.cloudmoonapp.com',
      cloud: 'https://web.cloudmoonapp.com',
      google: 'https://www.google.com',
      youtube: 'https://www.youtube.com',
      yt: 'https://www.youtube.com',
      poki: 'https://poki.com',
      itch: 'https://itch.io',
      reddit: 'https://www.reddit.com',
      wikipedia: 'https://www.wikipedia.org',
      wiki: 'https://www.wikipedia.org',
      twitter: 'https://www.twitter.com',
      x: 'https://www.x.com',
      steam: 'https://store.steampowered.com',
      roblox: 'https://www.roblox.com',
      friv: 'https://www.friv.com',
      coolmath: 'https://www.coolmathgames.com',
      netflix: 'https://www.netflix.com',
      twitch: 'https://www.twitch.tv',
    };

    function resolve(input) {
      if (!input) return null;
      input = input.trim();
      const key = input.toLowerCase().replace(/^www\./, '');
      if (known[key]) return known[key];
      if (input.startsWith('http://') || input.startsWith('https://')) return input;
      if (input.includes('.')) return 'https://' + input;
      return 'https://www.google.com/search?q=' + encodeURIComponent(input);
    }

    function setStatus(msg, ready) {
      document.getElementById('status-text').textContent = msg;
      const s = document.getElementById('status');
      const dot = s.querySelector('.dot');
      if (ready) {
        s.className = 'ready';
        dot.classList.remove('spin');
      } else {
        s.className = 'loading';
        dot.classList.add('spin');
      }
      document.getElementById('go-btn').disabled = !ready;
    }

    // Register the Ultraviolet service worker and set up bare-mux transport
    async function registerSW() {
      if (!('serviceWorker' in navigator)) {
        setStatus('Browser not supported', false);
        return;
      }
      try {
        // Register the service worker and wait for it to become active
        const reg = await navigator.serviceWorker.register('/sw.js', {
          scope: __uv$config.prefix,
        });
        await new Promise((resolve) => {
          if (reg.active) return resolve();
          const worker = reg.installing || reg.waiting;
          if (worker) {
            worker.addEventListener('statechange', (e) => {
              if (e.target.state === 'activated') resolve();
            });
          } else {
            reg.addEventListener('updatefound', () => {
              reg.installing.addEventListener('statechange', (e) => {
                if (e.target.state === 'activated') resolve();
              });
            });
          }
        });

        // Set up bare-mux transport in the background (epoxy over wisp)
        const wispUrl = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/wisp/';
        const conn = new BareMux.BareMuxConnection('/bare-mux/worker.js');
        conn.setTransport('/epoxy/index.mjs', [{ wisp: wispUrl }]).catch(console.error);

        setStatus('Ready — click any site to browse!', true);
      } catch (err) {
        console.error('SW error:', err);
        setStatus('Setup error: ' + err.message, false);
      }
    }

    function go(directUrl) {
      const url = directUrl || resolve(document.getElementById('url').value);
      if (!url) return;
      // UV encodes the URL and navigates through the service worker
      location.href = __uv$config.prefix + __uv$config.encodeUrl(url);
    }

    document.getElementById('url').addEventListener('keydown', e => {
      if (e.key === 'Enter') go();
    });

    registerSW();
  </script>
</body>
</html>
